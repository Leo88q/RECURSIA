[package]
name = "recursia"
version = "1.0.0"
description = "RECURSIA — nested cellular universes on Solana"
edition = "2021"
rust-version = "1.79.0"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "recursia"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# checklist #30/#66: exact pins
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "associated_token"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
